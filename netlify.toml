# Next.js on Netlify: Netlify detects Next.js and applies its Next.js runtime
# (OpenNext adapter) automatically. No publish directory is set on purpose.
#
# Dependencies are installed explicitly before "next build" so the build works
# even in environments that skip Netlify's automatic install step (that is what
# caused "next: command not found"). `npm run build` runs `next build` with
# node_modules/.bin on the PATH.
[build]
  command = "npm ci --no-audit --no-fund && npm run build"

[build.environment]
  NODE_VERSION = "22"
